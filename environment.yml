name: mber
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python>=3.11
  - pip
  - setuptools
  - numpy==1.26.4
  - openmm==8.0.0
  - pdbfixer==1.9
  - anarci
  - ffmpeg
  # Use PyTorch CUDA wheels as an extra index so other pip deps still resolve from PyPI.
  # Works with conda, mamba, and micromamba. Tested with CUDA 12.8.
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu128
    - -e .
    - -e ./protocols
